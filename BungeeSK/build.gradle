plugins {
    id "java"
    id "com.gradleup.shadow" version "9.6.1"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    compileOnly group: "io.papermc.paper", name: "paper-api", version: "1.21.11-R0.1-SNAPSHOT"
    compileOnly group: "net.md-5", name: "bungeecord-api", version: "1.21-R0.4"
    compileOnly group: "org.jetbrains", name: "annotations", version: "24.1.0"
    // Optional PlaceholderAPI integration (soft-depend); the expansion registers only when PAPI is present.
    compileOnly group: "me.clip", name: "placeholderapi", version: "2.11.6"
    compileOnly(group: "com.github.SkriptLang", name: "Skript", version: "2.16.0") {
        exclude group: "com.sk89q.worldguard", module: "worldguard-legacy"
        exclude group: "net.milkbowl.vault", module: "Vault"
    }
    implementation group: "commons-io", name: "commons-io", version: "2.18.0"

    implementation group: "com.github.rockaport", name: "alice", version: "0.9.0"
    implementation group: "com.github.Carleslc.Simple-YAML", name: "Simple-Yaml", version: "1.8.4"
    implementation group: "io.methvin", name: "directory-watcher", version: "0.15.1"
    implementation group: "org.xerial", name: "sqlite-jdbc", version: "3.47.1.0"
    // Optional Redis backend for global variables (proxy-side). slf4j/gson are provided by the proxy.
    implementation(group: "redis.clients", name: "jedis", version: "5.1.5") {
        exclude group: "org.slf4j"
        exclude group: "com.google.code.gson"
    }

    // MiniMessage rendering for the BungeeCord side. Relocated (see shadowJar) so the shaded copy
    // can't clash with the Adventure that Paper already provides on the game-server side. Velocity
    // provides its own Adventure, so these are not added to the VelocitySK module.
    implementation group: "net.kyori", name: "adventure-api", version: "4.17.0"
    implementation group: "net.kyori", name: "adventure-text-minimessage", version: "4.17.0"
    // Used to render MiniMessage to chat-component JSON, which BungeeCord's own ComponentSerializer
    // then parses into BaseComponent[]. gson itself is provided by BungeeCord/Paper at runtime.
    implementation(group: "net.kyori", name: "adventure-text-serializer-gson", version: "4.17.0") {
        exclude group: "com.google.code.gson"
    }

    testImplementation platform("org.junit:junit-bom:5.11.3")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

tasks.named("test") {
    useJUnitPlatform()
}

// Bake the short git commit + build time into a resource (bungeesk-build.properties) so the version
// commands can report exactly which build is running — useful for confirming a dev build. Generated at
// execution time (configuration-cache safe) and always regenerated so the commit/time stay current. If
// git is unavailable the commit falls back to "unknown".
def buildInfoDir = layout.buildDirectory.dir("generated/buildinfo")
def buildInfoRepoDir = rootProject.projectDir
def buildInfoVersion = project.version.toString()
tasks.register("generateBuildInfo") {
    def outFile = buildInfoDir.map { it.file("bungeesk-build.properties") }
    outputs.file(outFile)
    outputs.upToDateWhen { false }
    doLast {
        def commit = "unknown"
        try {
            def proc = ["git", "rev-parse", "--short", "HEAD"].execute(null, buildInfoRepoDir)
            proc.waitForOrKill(5000)
            def text = proc.in.text.trim()
            if (proc.exitValue() == 0 && !text.isEmpty()) commit = text
        } catch (ignored) {
        }
        def buildTime = new Date().format("yyyy-MM-dd'T'HH:mm:ss'Z'", TimeZone.getTimeZone("UTC"))
        def file = outFile.get().asFile
        file.parentFile.mkdirs()
        file.text = "version=${buildInfoVersion}\ncommit=${commit}\nbuildTime=${buildTime}\n"
    }
}
sourceSets.main.resources.srcDir(buildInfoDir)
tasks.named("processResources") { dependsOn("generateBuildInfo") }

[compileJava, compileTestJava]*.options*.encoding = "UTF-8"

shadowJar {
    // Internal build intermediate (fused into the published BungeeSK.jar by root :universalJar);
    // named distinctly so it doesn't collide with the universal jar's "BungeeSK.jar".
    archiveFileName = "BungeeSK-Paper-Bungee.jar"

    // Drop native libs / tooling resources for platforms we don't ship for (see root build.gradle).
    rootProject.ext.prunedJarPaths.each { exclude it }

    // Keep the shaded Adventure away from Paper's own net.kyori classes.
    relocate "net.kyori", "fr.zorg.shaded.kyori"
    // Relocate the Redis client + its pool so they can't clash with another plugin's copy.
    relocate "redis.clients", "fr.zorg.shaded.jedis"
    relocate "org.apache.commons.pool2", "fr.zorg.shaded.pool2"
    // Adventure resolves MiniMessage / serializer implementations via ServiceLoader; this relocates
    // the META-INF/services provider files to match the shaded package (otherwise the providers are
    // not found at runtime and MiniMessage silently fails).
    mergeServiceFiles()

    minimize {
        exclude dependency("org.xerial:sqlite-jdbc:.*")
        // MiniMessage resolves tags via reflection/services; don't let minimize strip it.
        exclude dependency("net.kyori:.*")
        // Jedis + its pool use reflection internally; keep them whole.
        exclude dependency("redis.clients:jedis:.*")
        exclude dependency("org.apache.commons:commons-pool2:.*")
    }
}
