name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Least privilege by default; the release job opts into write below.
permissions:
  contents: read

# Cancel superseded runs on the same branch/PR to save runner minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build jars
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # Official Gradle action: caches ~/.gradle (dependencies + wrapper) and only writes the
      # cache from the default branch, so PRs read it but can't poison it.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build all jars
        run: ./gradlew buildAll --stacktrace

      # Three separate artifacts so the run page offers one download per jar (each downloads as its
      # own zip — GitHub always zips artifact downloads; raw jars come from the Release job below).
      - name: Upload universal jar
        uses: actions/upload-artifact@v7
        with:
          name: BungeeSK-Universal
          path: build/libs/BungeeSK-Universal.jar
          if-no-files-found: error
          retention-days: 30

      - name: Upload game-server + BungeeCord jar
        uses: actions/upload-artifact@v7
        with:
          name: BungeeSK
          path: BungeeSK/build/libs/BungeeSK.jar
          if-no-files-found: error
          retention-days: 30

      - name: Upload Velocity jar
        uses: actions/upload-artifact@v7
        with:
          name: BungeeSK-Velocity
          path: VelocitySK/build/libs/BungeeSK-Velocity.jar
          if-no-files-found: error
          retention-days: 30

  # Publishes a GitHub Release with the built jars whenever a v* tag is pushed.
  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download built jars
        uses: actions/download-artifact@v8
        with:
          pattern: BungeeSK*
          merge-multiple: true
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          dist/*.jar
          --repo "${{ github.repository }}"
          --title "${{ github.ref_name }}"
          --generate-notes
