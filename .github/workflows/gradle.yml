name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Least privilege by default; the release job opts into write below.
permissions:
  contents: read

# Cancel superseded runs on the same branch/PR to save runner minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build jars
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # Official Gradle action: caches ~/.gradle (dependencies + wrapper) and only writes the
      # cache from the default branch, so PRs read it but can't poison it.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run tests
        run: ./gradlew test --stacktrace

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: BungeeSK/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7

      - name: Build all jars
        run: ./gradlew buildAll --stacktrace

      # Only the universal jar (build/libs/BungeeSK.jar) is published; the per-platform jars are
      # internal build intermediates that :universalJar fuses together. (Artifact downloads are always
      # zipped by GitHub; the raw jar is attached to the Release below.)
      - name: Upload jar
        uses: actions/upload-artifact@v7
        with:
          name: BungeeSK
          path: build/libs/BungeeSK.jar
          if-no-files-found: error
          retention-days: 30

  # Publishes a GitHub Release with the built jars whenever a v* tag is pushed.
  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download the jar
        uses: actions/download-artifact@v8
        with:
          name: BungeeSK
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          dist/BungeeSK.jar
          --repo "${{ github.repository }}"
          --title "${{ github.ref_name }}"
          --generate-notes
