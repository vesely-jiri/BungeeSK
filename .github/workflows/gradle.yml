name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Least privilege by default; the release job opts into write below.
permissions:
  contents: read

# Cancel superseded runs on the same branch/PR to save runner minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build jars
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # Official Gradle action: caches ~/.gradle (dependencies + wrapper) and only writes the
      # cache from the default branch, so PRs read it but can't poison it.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run tests
        run: ./gradlew test --stacktrace

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: BungeeSK/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7

      - name: Build all jars
        run: ./gradlew buildAll --stacktrace

      # Only the universal jar (build/libs/BungeeSK.jar) is published; the per-platform jars are
      # internal build intermediates that :universalJar fuses together. (Artifact downloads are always
      # zipped by GitHub; the raw jar is attached to the Release below.)
      - name: Upload jar
        uses: actions/upload-artifact@v7
        with:
          name: BungeeSK
          path: build/libs/BungeeSK.jar
          if-no-files-found: error
          retention-days: 30
          # The jar is already a compressed zip; re-deflating it saves ~1 MB but wastes CPU on both
          # ends. Store it (GitHub still wraps the artifact in a zip container either way).
          compression-level: 0

  # Boots a throwaway Paper server with Skript + the built jar and loads a script that exercises every
  # BungeeSK syntax; fails if any syntax no longer registers or parses. Guards the SyntaxRegistry
  # migration — a regression a compile check can't see. Runs independently (does not gate the release).
  syntax-tests:
    name: Skript syntax tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # Reuse the jar the build job already produced (the actual shipped universal jar) instead of
      # rebuilding it here.
      - name: Download the built jar
        uses: actions/download-artifact@v8
        with:
          name: BungeeSK
          path: dist

      - name: Cache server jars
        uses: actions/cache@v4
        with:
          path: ~/.cache/bungeesk-integration
          key: bungeesk-it-jars-velocity3.5.1-paper1.21.11-skript2.16.0

      - name: Run Skript syntax tests
        run: bash scripts/run-syntax-tests.sh dist/BungeeSK.jar

  # Boots a real Velocity proxy + Paper game server (both running the built jar), actually connected
  # over BungeeSK's socket, and checks the connection-dependent behaviour a single-server boot can't:
  # auto-connect, a stable link under the keep-alive, and a clean shutdown while connected. Guards the
  # connection-stability fixes. Independent (does not gate the release); heavier, so its own job.
  integration-tests:
    name: Two-server integration test
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Download the built jar
        uses: actions/download-artifact@v8
        with:
          name: BungeeSK
          path: dist

      # Cache the Velocity/Paper/Skript jars the script downloads so reruns don't refetch ~120 MB.
      - name: Cache server jars
        uses: actions/cache@v4
        with:
          path: ~/.cache/bungeesk-integration
          key: bungeesk-it-jars-velocity3.5.1-paper1.21.11-skript2.16.0

      - name: Run two-server integration test
        run: bash scripts/integration-test.sh dist/BungeeSK.jar

  # Publishes a GitHub Release with the built jars whenever a v* tag is pushed.
  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Needed for the CHANGELOG; the jar itself comes from the build artifact below.
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download the jar
        uses: actions/download-artifact@v8
        with:
          name: BungeeSK
          path: dist

      # Pull the section for this tag (e.g. "## 2.2.0") out of CHANGELOG.md so the Release
      # body is the curated changelog, not an auto-generated commit dump. Falls back to
      # --generate-notes below if the version has no CHANGELOG section.
      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            /^## / {
              if (found) exit
              if ($0 ~ "^## +" ver "([^0-9.]|$)") { found = 1; next }
              next
            }
            found { print }
          ' CHANGELOG.md > release-notes.md
          sed -i '/./,$!d' release-notes.md   # drop leading blank lines
          if grep -q '[^[:space:]]' release-notes.md; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release (curated notes from CHANGELOG)
        if: steps.notes.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          dist/BungeeSK.jar
          --repo "${{ github.repository }}"
          --title "${{ github.ref_name }}"
          --notes-file release-notes.md

      - name: Publish release (auto-generated notes fallback)
        if: steps.notes.outputs.found == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          dist/BungeeSK.jar
          --repo "${{ github.repository }}"
          --title "${{ github.ref_name }}"
          --generate-notes
