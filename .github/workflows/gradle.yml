name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Least privilege by default; the release job opts into write below.
permissions:
  contents: read

# Cancel superseded runs on the same branch/PR to save runner minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build jars
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # Official Gradle action: caches ~/.gradle (dependencies + wrapper) and only writes the
      # cache from the default branch, so PRs read it but can't poison it.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build all jars
        run: ./gradlew buildAll --stacktrace

      # Collect the three jars into one flat directory so the uploaded artifact (and thus the
      # downloaded release assets) are flat, not nested under each module's build/libs path.
      - name: Collect jars
        run: |
          mkdir -p staging
          cp build/libs/BungeeSK-Universal.jar \
             BungeeSK/build/libs/BungeeSK.jar \
             VelocitySK/build/libs/BungeeSK-Velocity.jar \
             staging/

      - name: Upload jars
        uses: actions/upload-artifact@v7
        with:
          name: BungeeSK-jars
          path: staging/
          if-no-files-found: error
          retention-days: 30

  # Publishes a GitHub Release with the built jars whenever a v* tag is pushed.
  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download built jars
        uses: actions/download-artifact@v8
        with:
          name: BungeeSK-jars
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          dist/*.jar
          --repo "${{ github.repository }}"
          --title "${{ github.ref_name }}"
          --generate-notes
